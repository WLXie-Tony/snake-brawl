<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#060b17">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Snake Brawl">
<meta name="description" content="Snake Brawl: a 3D multiplayer snake game for phones. Enter a room code and battle your friends. 蛇蛇乱斗：输入房间号就能和朋友对战的 3D 联机贪吃蛇。">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<style>:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Snake Brawl · 蛇蛇乱斗</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=ZCOOL+KuaiLe&display=swap">
<style>
/* Layout: full-bleed 3D arena; HUD pinned to corners (stats TL, leaderboard TR, minimap BL, fire+boost BR, room chip bottom-center); lobby, sheets and result float as cards over the live arena */
:root{
  --ground:#060b17;
  --panel:rgba(12,19,36,.88);
  --panel-soft:rgba(12,19,36,.6);
  --line:rgba(150,178,230,.16);
  --line-strong:rgba(170,195,240,.34);
  --ink:#eef3ff;
  --muted:#93a3c4;
  --candy:#ffc93c;
  --candy-deep:#c4850c;
  --candy-ink:#2b1b00;
  --danger:#ff4d5e;
  --ok:#3ee08f;
  --f-display:"ZCOOL KuaiLe","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --rare:#4fb6ff;--epic:#b77dff;--legend:#ffc93c;--common:#9aa7c2;
  --f-body:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--f-body);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
#game,#ovl{position:fixed;inset:0;width:100%;height:100%;display:block}
#game{touch-action:none;background:var(--ground)}
#ovl{pointer-events:none;z-index:1}

/* ---------- overlay screens ---------- */
.screen{position:fixed;inset:0;z-index:5;display:grid;place-items:center;overflow-y:auto;touch-action:pan-y;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-bottom,0px));
  background:radial-gradient(120% 90% at 50% 40%,rgba(6,11,23,.1),rgba(4,7,15,.74))}
.sheet{z-index:6;background:rgba(4,7,15,.72)}
.card{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:22px;
  padding:22px 20px 20px;display:grid;gap:16px;box-shadow:0 24px 70px rgba(0,0,0,.5);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);min-width:0}
.card.small{max-width:300px;justify-items:center;text-align:center;gap:14px}
.card.wide{max-width:560px}
.brand{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(46px,14vw,62px);line-height:1;color:var(--candy);
  display:flex;gap:2px;text-shadow:0 4px 0 var(--candy-deep),0 10px 28px rgba(255,201,60,.28)}
.brand span{display:inline-block;animation:drop .7s cubic-bezier(.2,1.6,.4,1) both}
.brand span:nth-child(1){transform:rotate(-5deg)}
.brand span:nth-child(2){transform:rotate(4deg) translateY(4px);animation-delay:.07s}
.brand span:nth-child(3){transform:rotate(-3deg);animation-delay:.14s}
.brand span:nth-child(4){transform:rotate(6deg) translateY(3px);animation-delay:.21s}
@keyframes drop{from{translate:0 -18px}to{translate:0 0}}
.tag{margin:8px 0 0;color:var(--muted);font-size:14px;line-height:1.5}
.lbl{font-size:12px;letter-spacing:.14em;color:var(--muted)}
.field{display:grid;gap:8px;min-width:0}
.field input{height:46px;border-radius:12px;border:1px solid var(--line-strong);background:rgba(255,255,255,.05);color:var(--ink);
  font:500 16px var(--f-body);padding:0 14px;-webkit-user-select:text;user-select:text;outline:none}
.field input:focus-visible{border-color:var(--candy);box-shadow:0 0 0 3px rgba(255,201,60,.25)}
.skinrow{display:flex;align-items:center;gap:12px;padding:8px 8px 8px 10px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.skinrow canvas{width:120px;height:44px;flex:none}
.skinrow b{flex:1;min-width:0;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.maps{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;touch-action:pan-x}
.maps::-webkit-scrollbar{display:none}
.map{flex:none;width:92px;display:grid;gap:5px;padding:5px;border-radius:12px;border:1.5px solid var(--line);background:rgba(255,255,255,.03);color:var(--ink);cursor:pointer;font:600 12.5px var(--f-body)}
.map canvas{width:80px;height:52px;border-radius:8px;display:block}
.map[aria-checked="true"]{border-color:var(--candy);background:rgba(255,201,60,.1)}
.map:focus-visible{outline:2px solid var(--candy);outline-offset:2px}
.maptip{margin:-6px 0 0;color:var(--muted);font-size:13px;line-height:1.5;min-height:1.5em}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{height:50px;border-radius:14px;border:0;font-family:var(--f-display);font-size:20px;cursor:pointer;color:var(--ink);
  transition:transform .08s ease,box-shadow .08s ease,opacity .2s}
.btn.primary{background:var(--candy);color:var(--candy-ink);box-shadow:0 4px 0 var(--candy-deep)}
.btn.primary:active{transform:translateY(3px);box-shadow:0 1px 0 var(--candy-deep)}
.btn.ghost{background:rgba(255,255,255,.04);border:1.5px solid var(--line-strong)}
.btn.ghost:active{transform:translateY(2px)}
.btn.small{height:38px;font-size:16px;padding:0 16px}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.linkbtn{background:none;border:0;color:var(--candy);font:600 14px var(--f-body);cursor:pointer;padding:6px 0;justify-self:start}
.linkbtn:focus-visible{outline:2px solid var(--candy)}
.rooms{display:grid;gap:10px;border-top:1px solid var(--line);padding-top:14px}
.rooms-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.net{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.net i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.net[data-s="ok"] i{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.net[data-s="off"] i{background:var(--danger)}
.net[data-s="wait"] i{animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.room-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.room{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:10px 10px 10px 12px;
  border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.room .dot{width:14px;height:14px;border-radius:50%}
.room .who{min-width:0}
.room .who b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.room .who small{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.empty,.help,.idle{margin:0;color:var(--muted);font-size:13px;line-height:1.55}
.idle{color:var(--ink);opacity:.8}
.msg{margin:0;padding:10px 12px;border-radius:12px;background:rgba(255,77,94,.12);border:1px solid rgba(255,77,94,.35);font-size:13.5px;line-height:1.5}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet-h h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:28px;color:var(--candy)}
.skins{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;max-height:min(62vh,520px);overflow-y:auto;padding:2px}
.skin{display:grid;gap:4px;justify-items:center;padding:8px 4px 7px;border-radius:12px;border:1.5px solid var(--line);background:rgba(255,255,255,.03);color:var(--ink);cursor:pointer;font:600 12.5px var(--f-body)}
.skin canvas{width:88px;height:32px}
.skin[aria-checked="true"]{border-color:var(--candy);background:rgba(255,201,60,.1)}
.skin:focus-visible{outline:2px solid var(--candy);outline-offset:2px}
.guide{display:grid;gap:14px;max-height:min(66vh,560px);overflow-y:auto;padding-right:2px}
.guide h3{margin:4px 0 0;font-size:13px;letter-spacing:.12em;color:var(--muted);font-weight:600}
.gi{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:center}
.gi img{width:40px;height:40px}
.gi b{display:block;font-size:15px}
.gi span{display:block;color:var(--muted);font-size:13px;line-height:1.45}
.gm{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:center}
.gm canvas{width:64px;height:42px;border-radius:8px}
.howto{margin:0;padding:0 0 0 18px;color:var(--muted);font-size:13px;line-height:1.7}
.howto b{color:var(--ink);font-weight:600}
.spin{width:42px;height:42px;border-radius:50%;border:4px solid rgba(255,255,255,.12);border-top-color:var(--candy);animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.over-k{margin:0;font-family:var(--f-display);font-size:30px;line-height:1.2;text-wrap:balance}
.over-k em{font-style:normal;color:var(--candy)}
.over-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.over-stats div{display:grid;gap:4px;padding:10px;border-radius:12px;background:rgba(255,255,255,.05)}
.over-stats b{font-family:var(--f-display);font-weight:400;font-size:28px;font-variant-numeric:tabular-nums}

/* ---------- in-game HUD ---------- */
.hud{position:fixed;inset:0;z-index:2;pointer-events:none;text-shadow:0 2px 8px rgba(0,0,0,.65)}
.stats{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:calc(10px + env(safe-area-inset-top,0px));display:grid;gap:4px;justify-items:start}
.len{display:flex;align-items:baseline;gap:8px}
.len b{font-family:var(--f-display);font-weight:400;font-size:36px;line-height:1;font-variant-numeric:tabular-nums}
.sub{display:flex;gap:10px;font-size:13px;font-variant-numeric:tabular-nums;opacity:.9}
.hearts{display:flex;gap:3px;min-height:18px}
.hearts img{width:18px;height:18px}
.buffs{display:flex;flex-wrap:wrap;gap:5px;max-width:52vw}
.buff{display:flex;align-items:center;gap:3px;padding:2px 7px 2px 2px;border-radius:999px;background:var(--panel-soft);font-size:12px;font-variant-numeric:tabular-nums;text-shadow:none}
.buff img{width:22px;height:22px}
.board{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));
  list-style:none;margin:0;padding:8px 10px;width:148px;border-radius:14px;background:var(--panel-soft);display:grid;gap:2px;text-shadow:none}
.board li{display:grid;grid-template-columns:16px 9px 1fr auto;align-items:center;gap:6px;font-size:12px;line-height:1.5;font-variant-numeric:tabular-nums;color:var(--muted)}
.board li i{width:9px;height:9px;border-radius:50%}
.board li span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.board li.p{color:var(--ink)}
.board li.me{color:var(--candy);font-weight:700}
.board li.gap{opacity:.5;display:block;text-align:center;line-height:.8}
#mini{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));width:100px;height:100px}
.bottomc{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:minmax(0,1fr);justify-items:center;gap:8px;width:min(calc(100vw - 236px),340px)}
.chip{pointer-events:auto;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:999px;
  padding:4px 4px 4px 12px;font-size:12.5px;white-space:nowrap;text-shadow:none;font-variant-numeric:tabular-nums;max-width:100%;min-width:0}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1 1 auto}
.chip button{height:28px;border-radius:999px;border:0;background:rgba(255,255,255,.1);color:var(--ink);font:600 12px var(--f-body);padding:0 12px;cursor:pointer;flex:none}
.chip button:focus-visible{outline:2px solid var(--candy)}
.feed{display:grid;gap:4px;justify-items:center}
.feed div{font-size:12.5px;padding:3px 10px;border-radius:999px;background:var(--panel-soft);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;animation:fadeup 4s forwards}
.feed div.mine{color:var(--candy)}
@keyframes fadeup{0%{opacity:0;transform:translateY(6px)}8%,80%{opacity:1;transform:none}100%{opacity:0}}
.netwarn{position:absolute;left:50%;top:calc(64px + env(safe-area-inset-top,0px));transform:translateX(-50%);font-size:12.5px;padding:5px 12px;border-radius:999px;
  background:rgba(255,77,94,.2);border:1px solid rgba(255,77,94,.45);white-space:nowrap}
.boost,.fire{position:fixed;z-index:3;right:max(18px,calc(env(safe-area-inset-right,0px) + 10px));border-radius:50%;touch-action:none;cursor:pointer;-webkit-user-select:none;user-select:none}
.boost{bottom:calc(20px + env(safe-area-inset-bottom,0px));width:84px;height:84px;border:3px solid rgba(255,201,60,.75);background:rgba(255,201,60,.14);color:var(--candy);
  font-family:var(--f-display);font-size:20px;transition:transform .08s,box-shadow .15s,background .15s}
.boost.on{transform:scale(.93);background:rgba(255,201,60,.38);color:#fff;box-shadow:0 0 30px 6px rgba(255,201,60,.45)}
.fire{bottom:calc(118px + env(safe-area-inset-bottom,0px));width:76px;height:76px;padding:0;border:2.5px dashed rgba(255,255,255,.3);background:rgba(12,19,36,.5);color:var(--muted);
  display:grid;place-items:center;font:600 12px var(--f-body);transition:transform .1s}
.fire img{width:62px;height:62px;display:block}
.fire.armed{border:3px solid #fff;background:rgba(12,19,36,.35);box-shadow:0 0 22px rgba(255,255,255,.3)}
.fire.armed:active{transform:scale(.92)}
.fire.pop{animation:popin .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes popin{0%{transform:scale(.5)}100%{transform:scale(1)}}
.fire .n{position:absolute;right:-4px;top:-4px;min-width:24px;height:24px;border-radius:12px;background:var(--candy);color:var(--candy-ink);font:800 13px var(--f-body);display:grid;place-items:center;padding:0 5px}
.fire:focus-visible,.boost:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.joy{position:fixed;left:0;top:0;z-index:3;width:120px;height:120px;border-radius:50%;border:2px solid rgba(255,255,255,.22);background:rgba(255,255,255,.05);pointer-events:none}
.joy .knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.3);box-shadow:0 2px 10px rgba(0,0,0,.35)}
.toast{position:fixed;z-index:4;left:50%;top:28%;transform:translate(-50%,-50%);pointer-events:none;font-family:var(--f-display);font-size:30px;color:var(--candy);
  text-shadow:0 3px 0 var(--candy-deep),0 0 24px rgba(0,0,0,.6);white-space:nowrap;opacity:0;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis}
.toast.show{animation:pop 1.7s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}22%{transform:translate(-50%,-50%) scale(1)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%)}}
.hurt{position:fixed;inset:0;z-index:2;pointer-events:none;box-shadow:inset 0 0 90px 30px rgba(255,40,60,.55);opacity:0}
.hurt.show{animation:hurt .5s ease-out}
@keyframes hurt{0%{opacity:1}100%{opacity:0}}
.timer{position:absolute;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);font-family:var(--f-display);font-size:24px;line-height:1.2;
  font-variant-numeric:tabular-nums;padding:2px 14px;border-radius:999px;background:var(--panel-soft);text-shadow:none}
.timer.hot{color:var(--danger);animation:beat 1s infinite}
@keyframes beat{50%{transform:translateX(-50%) scale(1.12)}}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{height:40px;border-radius:12px;border:1.5px solid var(--line);background:rgba(255,255,255,.03);color:var(--ink);font:600 14px var(--f-body);cursor:pointer}
.seg button[aria-checked="true"]{border-color:var(--candy);background:rgba(255,201,60,.1)}
.seg button:focus-visible{outline:2px solid var(--candy);outline-offset:2px}
.res-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.res-list li{display:grid;grid-template-columns:24px 14px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.05);font-variant-numeric:tabular-nums}
.res-list li.me{box-shadow:inset 0 0 0 1.5px var(--candy)}
.res-list b.rk{font-family:var(--f-display);font-size:20px;font-weight:400;color:var(--muted)}
.res-list li:first-child b.rk{color:var(--candy)}
.res-list i{width:14px;height:14px;border-radius:50%}
.res-list span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.res-list small{color:var(--muted);font-size:12.5px;text-align:right;line-height:1.35}
.res-list small b{color:var(--ink);font-size:15px}
.buff .ring{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none;background:conic-gradient(var(--c) calc(var(--p)*1turn),rgba(255,255,255,.14) 0)}
.buff .ring img{width:21px;height:21px}
.fire .wn{position:absolute;left:50%;bottom:100%;transform:translateX(-50%);margin-bottom:5px;font:700 12px var(--f-body);color:#fff;white-space:nowrap;text-shadow:0 1px 4px rgba(0,0,0,.85)}
.joinrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.joinrow input{height:44px;border-radius:12px;border:1px solid var(--line-strong);background:rgba(255,255,255,.05);color:var(--ink);font:700 18px var(--f-body);letter-spacing:.2em;
  padding:0 14px;-webkit-user-select:text;user-select:text;outline:none;min-width:0;font-variant-numeric:tabular-nums}
.joinrow input::placeholder{letter-spacing:0;font-weight:500;font-size:15px;color:var(--muted)}
.joinrow input:focus-visible{border-color:var(--candy);box-shadow:0 0 0 3px rgba(255,201,60,.25)}
.joinrow .btn{height:44px}
.codebar{display:grid;justify-items:center;gap:1px;padding:6px 14px 7px;border-radius:14px;background:var(--candy);color:var(--candy-ink);
  font:700 13px var(--f-body);line-height:1.25;white-space:nowrap;text-shadow:none;box-shadow:0 4px 18px rgba(0,0,0,.35);max-width:100%}
.codebar b{font-family:var(--f-display);font-weight:400;font-size:24px;letter-spacing:.1em;line-height:1.1}
.codebar small{font:600 11.5px var(--f-body);white-space:normal;text-align:center;max-width:150px}
.chip .snd{padding:0;width:32px;display:grid;place-items:center}
.chip .snd svg{width:18px;height:18px;display:block}
html[lang="en"]{--f-display:"Fredoka","ZCOOL KuaiLe",system-ui,sans-serif}
.lobby-h{position:relative}
.brand.en{font-size:clamp(40px,12.5vw,56px);gap:12px;flex-wrap:wrap;letter-spacing:.01em}
.langbtn{position:absolute;right:0;top:0;height:32px;min-width:52px;padding:0 10px;border-radius:999px;border:1.5px solid var(--line-strong);background:rgba(255,255,255,.04);
  color:var(--ink);font:700 13px var(--f-body);cursor:pointer}
.langbtn:focus-visible{outline:2px solid var(--candy);outline-offset:2px}
.coin{display:inline-block;width:14px;height:14px;border-radius:50%;flex:none;vertical-align:-2px;
  background:radial-gradient(circle at 35% 30%,#fff6c4 0,#ffc93c 45%,#b97d0a 100%);box-shadow:inset 0 0 0 1.5px #9a6400}
.xpbar{position:relative;display:block;height:8px;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden;min-width:0}
.xpbar i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:999px;background:linear-gradient(90deg,#3ee08f,#9cff3d);transition:width .9s cubic-bezier(.2,.8,.3,1)}
.lvb{flex:none;font:700 12px var(--f-body);padding:3px 8px;border-radius:999px;background:rgba(62,224,143,.16);color:#7dffbe;font-variant-numeric:tabular-nums}
.acct{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;padding:9px 12px;border-radius:14px;
  border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--ink);cursor:pointer;font:600 13px var(--f-body);text-align:left}
.acct .coins{display:flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums}
.acct:focus-visible{outline:2px solid var(--candy);outline-offset:2px}
.dotnew{position:absolute;right:-4px;top:-4px;width:12px;height:12px;border-radius:50%;background:var(--danger);box-shadow:0 0 0 2px var(--ground)}
.skinrow .btn{position:relative}
/* locker */
.locker{max-height:calc(100dvh - 32px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));grid-template-rows:auto auto auto auto auto minmax(90px,1fr) auto;gap:10px;overflow:hidden;padding:18px 16px 16px}
.lk-acct{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px}
.lk-acct .coins{display:flex;align-items:center;gap:5px;font:700 15px var(--f-body);font-variant-numeric:tabular-nums}
.lk-xp{display:grid;gap:3px;min-width:0}.lk-xp small{color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums}
.lk-next{margin:-4px 0 0;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:4px;border-radius:14px;background:rgba(255,255,255,.05)}
.tabs button{position:relative;height:36px;border:0;border-radius:10px;background:none;color:var(--muted);font:700 13px var(--f-body);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.tabs button[aria-selected="true"]{background:rgba(255,201,60,.16);color:var(--candy)}
.tabs button.hasnew::after{content:"";position:absolute;right:6px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--danger)}
.tabs button:focus-visible{outline:2px solid var(--candy);outline-offset:1px}
.lk-sub{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:12px;color:var(--muted)}
.lk-test{color:#ffd98a;text-align:right;font-size:11.5px;line-height:1.35}
.lk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;overflow-y:auto;padding:2px;min-height:90px;align-content:start;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.lk-item{--tc:var(--common);position:relative;display:grid;gap:3px;justify-items:center;padding:7px 4px 6px;border-radius:12px;border:1.5px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.04);background:linear-gradient(180deg,color-mix(in srgb,var(--tc) 18%,transparent),transparent 60%),rgba(255,255,255,.03);color:var(--ink);cursor:pointer;font:600 12px var(--f-body);min-width:0}
.lk-item[data-tier="r"]{--tc:var(--rare)}.lk-item[data-tier="e"]{--tc:var(--epic)}.lk-item[data-tier="l"]{--tc:var(--legend)}
.lk-item::before{content:"";position:absolute;left:10px;right:10px;top:0;height:2.5px;border-radius:0 0 3px 3px;background:var(--tc)}
.lk-item canvas{width:88px;height:32px}
.lk-item:not(.owned) canvas{opacity:.78}
.lk-item[aria-pressed="true"]{border-color:var(--candy);background:rgba(255,201,60,.12)}
.lk-item:focus-visible{outline:2px solid var(--candy);outline-offset:2px}
.lk-n{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lk-s{display:inline-flex;align-items:center;gap:4px;font:700 11px var(--f-body);color:var(--muted);font-variant-numeric:tabular-nums}
.lk-s.eq{color:var(--ok)}.lk-s.own{color:#b9c7e6}.lk-s.usd{color:#ffd98a}.lk-s.coin{color:#ffe08a}.lk-s.lock{color:var(--muted)}
.lk-s .coin{width:11px;height:11px}
.lk-new{position:absolute;right:4px;top:4px;padding:1px 5px;border-radius:999px;background:var(--danger);color:#fff;font:800 9.5px var(--f-body)}
.lk-detail{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:12px;align-items:center;padding:10px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.lk-detail canvas{width:100%;aspect-ratio:600/220;height:auto;display:block}
.lk-info{display:grid;gap:6px;min-width:0}
.lk-name{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.lk-name b{font-size:16px}
.tier{font:700 10.5px var(--f-body);letter-spacing:.06em;padding:2px 7px;border-radius:999px;border:1.5px solid}
.lk-desc{margin:0;color:var(--muted);font-size:12.5px;line-height:1.45}
.lk-acts{display:grid;gap:6px}.lk-acts .btn{height:40px;font-size:15px;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lk-note{color:#ffd98a;font-size:11.5px;min-height:1em}
@media (max-width:400px){.lk-detail{grid-template-columns:1fr}.lk-detail canvas{max-width:280px;justify-self:center}}
@media (max-height:700px){.lk-next{display:none}.locker{gap:8px}}
/* rewards */
.rew{display:grid;gap:8px;padding:10px 12px;border-radius:14px;background:rgba(62,224,143,.07);border:1px solid rgba(62,224,143,.22)}
.rew-l{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.rew-l b{font:400 22px var(--f-display);color:var(--ink);font-variant-numeric:tabular-nums}.rew-l .sep{opacity:.5}.rew-l small{margin-left:auto;color:#7dffbe;font-weight:700}
.rew-bar{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center}.rew-bar small{color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums}
.rew-up{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-top:6px;border-top:1px dashed rgba(255,255,255,.14);font-size:13px;color:var(--candy);font-weight:700}
.rew-up .linkbtn{padding:0}
/* emotes */
.emo{position:fixed;z-index:3;left:max(16px,calc(env(safe-area-inset-left,0px) + 10px));bottom:calc(126px + env(safe-area-inset-bottom,0px));width:50px;height:50px;border-radius:50%;
  border:2px solid rgba(255,255,255,.3);background:rgba(12,19,36,.55);color:var(--ink);display:grid;place-items:center;cursor:pointer;touch-action:none;transition:opacity .2s,transform .1s}
.emo svg{width:26px;height:26px}
.emo:active{transform:scale(.92)}.emo.cool{opacity:.4}
.emo:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.emobar{position:fixed;z-index:4;left:max(16px,calc(env(safe-area-inset-left,0px) + 10px));bottom:calc(184px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(4,46px);gap:6px;
  padding:8px;border-radius:16px;background:var(--panel);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.4);touch-action:none}
.emo-i{width:46px;height:46px;border-radius:12px;border:0;background:rgba(255,255,255,.07);font-size:26px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0}
.emo-i.txt{font:400 20px var(--f-display);color:#ff5a64}
.emo-i:active{transform:scale(.9);background:rgba(255,201,60,.2)}
@media (max-width:380px){.board{width:128px}.len b{font-size:30px}}
@media (prefers-reduced-motion:reduce){.xpbar i{transition:none}.brand span,.toast.show,.feed div,.spin,.timer.hot,.net[data-s="wait"] i,.fire.pop,.hurt.show{animation-duration:.01ms!important;animation-iteration-count:1!important}.toast.show{opacity:1}}
</style>

function detectLang(){try{const v=JSON.parse(localStorage.getItem('ssld-lang')||'null');if(v&&I18N[v])return v;}catch(e){}
  const n=String((navigator.languages&&navigator.languages[0])||navigator.language||'en');return /^zh/i.test(n)?'zh':'en';}
let LANG=detectLang();
function t(k,v){let s=I18N[LANG][k];if(s==null)s=I18N.en[k];if(s==null)s=k;
  if(v)s=s.replace(/\{(\w+)\}/g,(m,x)=>v[x]!=null?String(v[x]):m);return s;}
function applyI18n(){const html=document.documentElement;html.lang=LANG==='zh'?'zh-CN':'en';document.title=t('title');
  const tm=document.querySelector('meta[name="apple-mobile-web-app-title"]');if(tm)tm.setAttribute('content',t('title'));
  document.querySelectorAll('[data-i]').forEach(el=>{el.textContent=t(el.dataset.i);});
  document.querySelectorAll('[data-i-ph]').forEach(el=>{el.setAttribute('placeholder',t(el.dataset.iPh));});
  document.querySelectorAll('[data-i-al]').forEach(el=>{el.setAttribute('aria-label',t(el.dataset.iAl));});}
const langHooks=[];
function setLang(l){if(!I18N[l]||l===LANG)return;LANG=l;try{localStorage.setItem('ssld-lang',JSON.stringify(l));}catch(e){}
  applyI18n();for(const h of langHooks){try{h();}catch(e){console.error(e);}}}

function hash32(a,b,c){let h=Math.imul(a|0,0x27d4eb2d)^Math.imul(b|0,0x165667b1)^Math.imul(c|0,0x9e3779b1);
  h=Math.imul(h^(h>>>15),0x85ebca6b);h=Math.imul(h^(h>>>13),0xc2b2ae35);return (h^(h>>>16))>>>0;}
const rnd3=(a,b,c)=>hash32(a,b,c)/4294967296;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

function genObstacles(mi,seed){const m=MAPS[mi],rng=mulberry32((seed^Math.imul(mi+1,0x9e3779b1))>>>0),out=[];
  for(const [type,n,r0,r1] of m.obs){let placed=0,tries=0;
    while(placed<n&&tries<n*80){tries++;const r=r0+(r1-r0)*rng(),a=rng()*TAU,d=Math.sqrt(rng())*(R-r-160),x=Math.cos(a)*d,y=Math.sin(a)*d;
      let ok=true;
      for(const o of out){const pad=(type==='planet'||o.type==='planet')?320:((type==='bush'||o.type==='bush')?26:150),need=o.r+r+pad;
        if((o.x-x)*(o.x-x)+(o.y-y)*(o.y-y)<need*need){ok=false;break;}}
      if(!ok)continue;out.push({type,x,y,r,i:out.length,u:rng(),meta:OBS[type]});placed++;}}
  return out;}

/* colour + scale of drawn segment j out of N at time t (ms). Writes into out[0..2], returns scale */
function skinColor(sk,j,N,t,out){const c=sk.rgb;let col,k=1,sc=1;
  switch(sk.pat){
    case 'stripe':col=c[(j>>2)&1];break;
    case 'stripe2':col=c[(j>>1)&1];break;
    case 'block':col=c[((j/3)|0)&1];break;
    case 'cycle':col=c[j%c.length];break;
    case 'zebra':col=c[j%3===0?1:0];break;
    case 'tiger':col=c[j%4===0?1:0];break;
    case 'beads':col=c[j&1];sc=(j&1)?0.62:1;break;
    case 'confetti':col=c[hash32(j,7,3)%c.length];break;
    case 'solid':col=c[0];k=((j>>2)&1)?0.9:1;break;
    case 'rainbow':col=hsl(j*0.03-t*0.00025,0.85,0.58);break;
    case 'beads2':col=c[j&1];sc=(j&1)?0.34:1;break;
    case 'boba':col=c[hash32(j,5,2)&1];sc=0.84;break;
    case 'sauce':col=c[j%6===5?1:0];break;
    case 'yin':col=c[j%8===6?1:0];sc=j%8===6?0.86:1;break;
    case 'holo':{const h=hsl(0.66+0.17*Math.sin(j*0.35-t*0.003),0.95,0.62),k2=0.78+0.22*Math.sin(t*0.05+j*0.7);out[0]=h[0]*k2;out[1]=h[1]*k2;out[2]=h[2]*k2;return sc;}
    case 'magma':{const hot=hash32(j,3,9)%3===0;if(hot){const p=0.75+0.25*Math.sin(t*0.006+j*1.3),a=c[1],b=c[2];out[0]=lerp(a[0],b[0],p);out[1]=lerp(a[1],b[1],p);out[2]=lerp(a[2],b[2],p);}
      else{const v=0.85+0.3*rnd3(j,4,4);out[0]=c[0][0]*v;out[1]=c[0][1]*v;out[2]=c[0][2]*v;}return sc;}
    case 'galaxy':{const f=N>1?j/(N-1):0,p=f*(c.length-1),i0=Math.min(c.length-2,Math.floor(p)),u=p-i0,a=c[i0],b=c[i0+1];
      out[0]=lerp(a[0],b[0],u);out[1]=lerp(a[1],b[1],u);out[2]=lerp(a[2],b[2],u);
      if(hash32(j,11,5)%5===0){const w=0.45+0.55*Math.max(0,Math.sin(t*0.006+j*1.7));out[0]=lerp(out[0],1,w);out[1]=lerp(out[1],1,w);out[2]=lerp(out[2],1,w);}return sc;}
    case 'pastel':col=hsl(j*0.025-t*0.00015,0.8,0.83);break;
    case 'grad':case 'flame':{const f=N>1?j/(N-1):0,p=f*(c.length-1),i0=Math.min(c.length-2,Math.floor(p)),u=p-i0,a=c[i0],b=c[i0+1];
      out[0]=lerp(a[0],b[0],u);out[1]=lerp(a[1],b[1],u);out[2]=lerp(a[2],b[2],u);
      if(sk.pat==='flame'){const fl=0.82+0.18*Math.sin(t*0.018+j*0.9);out[0]*=fl;out[1]*=fl;out[2]*=fl;}
      return sc;}
    default:col=c[0];}
  out[0]=col[0]*k;out[1]=col[1]*k;out[2]=col[2]*k;return sc;}
function skinMain(sk){return sk.headRgb||sk.rgb[0];}
function skinCss(sk){return rgbCss(skinMain(sk));}

function glyph(g,id,s,col){g.save();g.scale(s/100,s/100);g.fillStyle=col;g.strokeStyle=col;g.lineCap='round';g.lineJoin='round';
  const P=pts=>{g.beginPath();g.moveTo(pts[0],pts[1]);for(let i=2;i<pts.length;i+=2)g.lineTo(pts[i],pts[i+1]);g.closePath();g.fill();};
  switch(id){
    case 'shield':g.beginPath();g.moveTo(50,10);g.lineTo(84,22);g.bezierCurveTo(84,56,72,76,50,90);g.bezierCurveTo(28,76,16,56,16,22);g.closePath();g.fill();
      g.globalCompositeOperation='destination-out';g.lineWidth=7;g.beginPath();g.moveTo(34,50);g.lineTo(46,62);g.lineTo(68,38);g.stroke();break;
    case 'turbo':P([14,24,44,50,14,76,28,76,58,50,28,24]);P([42,24,72,50,42,76,56,76,86,50,56,24]);break;
    case 'magnet':g.lineWidth=17;g.beginPath();g.moveTo(29,30);g.lineTo(29,52);g.arc(50,52,21,Math.PI,0,true);g.lineTo(71,30);g.stroke();
      g.fillRect(20,10,18,14);g.fillRect(62,10,18,14);break;
    case 'heart':g.beginPath();g.moveTo(50,86);g.bezierCurveTo(14,62,8,40,18,26);g.bezierCurveTo(28,12,46,16,50,32);g.bezierCurveTo(54,16,72,12,82,26);g.bezierCurveTo(92,40,86,62,50,86);g.fill();break;
    case 'grow':g.font='900 50px '+BODY_FONT;g.textAlign='center';g.textBaseline='middle';g.fillText('×3',50,54);break;

function inSolid(x,y,pad){for(const o of G.obstacles){if(!o.meta.solid)continue;const rr=o.r+pad,dx=x-o.x,dy=y-o.y;if(dx*dx+dy*dy<rr*rr)return o;}return null;}

function spawnDeathDrops(P,mass,skin,now){const n2=P.length>>1;if(!n2||mass<1)return;
  const cnt=clamp(Math.round(mass/5),3,45),v=clamp(Math.round(mass*0.75/cnt),1,35),c=10+(skin|0);

/* ================= standalone build: phone-to-phone rooms over WebRTC (PeerJS) =================
   Mimics the small part of the claude.ai room API the game uses (join, presence, onPeers, peers,
   connected, onConnection, leave). The host relays every guest's presence to the other guests. */
const P2P_PREFIX='ssld-snake-v1-';
const P2P=(()=>{
  let peer=null,isHost=false,myLabel='',open=false,connHandlers=[],hbTimer=0;
  const conns=new Map(),rooms=new Map(),heard=new Map(),seqOut=new Map(),seqIn=new Map();
  const opts=()=>Object.assign({debug:0},window.__PEER_OPTS||{});
  function room(n){let r=rooms.get(n);if(!r){r={name:n,mine:{},joined:false,others:new Map(),handlers:[],snap:Object.freeze([])};rooms.set(n,r);}return r;}
  function mk(label,pres){return Object.freeze({peer:label,by:null,isMe:label===myLabel,sameTab:label===myLabel,kind:'viewer',guest:false,presence:Object.freeze(Object.assign({},pres||{})),updatedAt:performance.now()});}
  function rebuild(r){const l=[];if(r.joined)l.push(mk(myLabel,r.mine));for(const [k,p] of r.others)l.push(mk(k,p));return r.snap=Object.freeze(l);}
  function fire(r,j,u,lf){const peers=rebuild(r),by=x=>peers.find(p=>p.peer===x);
    const ch={peers,joined:j.map(by).filter(Boolean),updated:u.map(by).filter(Boolean),left:lf.map(x=>({peer:x,kind:'viewer',presence:{}}))};
    for(const h of r.handlers.slice()){try{h(ch);}catch(e){console.error(e);}}}
  function send(c,m){try{if(c.open)c.send(m);}catch(e){}}
  function bcast(m,except){for(const [id,c] of conns)if(id!==except)send(c,m);}
  function setOpen(v){if(open===v)return;open=v;for(const h of connHandlers.slice()){try{h(v);}catch(e){}}}
  function drop(label){heard.delete(label);for(const r of rooms.values())if(r.others.delete(label))fire(r,[],[],[label]);}
  function onMsg(fromId,m){if(!m||typeof m!=='object')return;heard.set(fromId,performance.now());if(m.k==='hb')return;
    if(isHost)bcast(m,fromId);
    const label=typeof m.f==='string'?m.f.slice(0,64):fromId;if(label===myLabel)return;
    if(m.k==='pr'&&typeof m.r==='string'){const key=m.r+'|'+label,s=m.s|0;if(s&&s<=(seqIn.get(key)||0))return;seqIn.set(key,s);
      const r=room(m.r),had=r.others.has(label);r.others.set(label,m.p&&typeof m.p==='object'?m.p:{});fire(r,had?[]:[label],had?[label]:[],[]);}
    else if(m.k==='lv'&&typeof m.r==='string'){const r=rooms.get(m.r);if(r&&r.others.delete(label))fire(r,[],[],[label]);}
    else if(m.k==='bye')drop(label);
    else if(m.k==='sync'&&m.rooms&&typeof m.rooms==='object'){for(const rn of Object.keys(m.rooms)){const r=room(rn);
      for(const e of m.rooms[rn]||[]){if(!Array.isArray(e)||e[0]===myLabel)continue;const had=r.others.has(e[0]);r.others.set(e[0],e[1]||{});fire(r,had?[]:[e[0]],had?[e[0]]:[],[]);}}}}
  function lost(id){conns.delete(id);drop(id);if(isHost)bcast({k:'bye',f:id});else setOpen(false);}
  function wire(c){c.on('data',m=>onMsg(c.peer,m));c.on('close',()=>{if(conns.get(c.peer)===c)lost(c.peer);});c.on('error',()=>{});}
  function heartbeat(){clearInterval(hbTimer);hbTimer=setInterval(()=>{const now=performance.now();bcast({k:'hb',f:myLabel});
    for(const [id,c] of conns)if(now-(heard.get(id)||now)>8000){try{c.close();}catch(e){}lost(id);}},1000);}
  function ns(name){return {name,
    presence(patch){const r=room(name);for(const k in patch){if(patch[k]===null)delete r.mine[k];else r.mine[k]=patch[k];}
      const s=(seqOut.get(name)||0)+1;seqOut.set(name,s);const m={k:'pr',r:name,f:myLabel,s,p:r.mine};if(isHost)bcast(m);else for(const c of conns.values())send(c,m);return Promise.resolve();},
    onPeers(h){const r=room(name);r.handlers.push(h);setTimeout(()=>{const l=rebuild(r);try{h({peers:l,joined:l,left:[],updated:[]});}catch(e){console.error(e);}},0);
      return ()=>{const i=r.handlers.indexOf(h);if(i>=0)r.handlers.splice(i,1);};},
    peers(){return room(name).snap;},
    connected(){return open;},
    onConnection(h){connHandlers.push(h);setTimeout(()=>h(open),0);return ()=>{const i=connHandlers.indexOf(h);if(i>=0)connHandlers.splice(i,1);};},
    leave(){const r=room(name);r.joined=false;r.others.clear();r.handlers=[];r.mine={};const m={k:'lv',r:name,f:myLabel};
      if(isHost)bcast(m);else for(const c of conns.values())send(c,m);return Promise.resolve();},
    emit(){return Promise.resolve();},on(){return ()=>{};}};}
  function lobbyNs(){const L=ns('lobby');L.presence=()=>Promise.resolve();L.join=async(name)=>{const r=room(name);r.joined=true;rebuild(r);return ns(name);};return L;}
  function newPeer(id){return new Promise((res,rej)=>{let p;try{p=id?new Peer(id,opts()):new Peer(opts());}catch(e){rej({type:'browser-incompatible'});return;}
    const t=setTimeout(()=>{rej({type:'timeout'});try{p.destroy();}catch(e){}},12000);
    p.on('open',()=>{clearTimeout(t);res(p);});p.on('error',e=>{clearTimeout(t);try{p.destroy();}catch(_){}rej(e||{type:'unknown'});});});}
  return {
    supported(){return typeof Peer!=='undefined'&&!!window.RTCPeerConnection;},
    info(){return {host:isHost,open,me:myLabel,conns:[...conns.keys()],rooms:[...rooms.values()].map(r=>r.name+':'+r.joined+':'+r.others.size+':'+r.handlers.length)};},
    async host(code){P2P.close();const p=await newPeer(P2P_PREFIX+code);peer=p;isHost=true;myLabel=p.id;
      p.removeAllListeners('error');p.on('error',e=>{if(e&&(e.type==='network'||e.type==='server-error'))setOpen(false);});
      p.on('connection',c=>{c.on('open',()=>{if(conns.size>=5){c.close();return;}conns.set(c.peer,c);heard.set(c.peer,performance.now());wire(c);
        const rs={};for(const [rn,r] of rooms){const e=[];if(r.joined)e.push([myLabel,r.mine]);for(const [l,pp] of r.others)e.push([l,pp]);rs[rn]=e;}
        send(c,{k:'sync',f:myLabel,rooms:rs});});});
      p.on('disconnected',()=>{setTimeout(()=>{try{if(peer===p&&!p.destroyed)p.reconnect();}catch(e){}},1000);});
      setOpen(true);heartbeat();return lobbyNs();},
    async join(code){P2P.close();const p=await newPeer(null);peer=p;isHost=false;myLabel=p.id;
      const c=p.connect(P2P_PREFIX+code,{serialization:'json',reliable:false});
      await new Promise((res,rej)=>{const t=setTimeout(()=>rej({type:'timeout'}),12000);c.on('open',()=>{clearTimeout(t);res();});
        p.removeAllListeners('error');p.on('error',e=>{clearTimeout(t);rej(e||{type:'unknown'});});});
      conns.set(c.peer,c);heard.set(c.peer,performance.now());wire(c);setOpen(true);heartbeat();return lobbyNs();},
    close(){clearInterval(hbTimer);try{bcast({k:'bye',f:myLabel});}catch(e){}for(const c of conns.values()){try{c.close();}catch(e){}}
      conns.clear();rooms.clear();heard.clear();seqIn.clear();seqOut.clear();if(peer){try{peer.destroy();}catch(e){}}peer=null;open=false;connHandlers=[];},
  };})();
function p2pErr(e){const ty=e&&e.type;
  if(ty==='peer-unavailable')return t('p2p.notfound');
  if(ty==='network'||ty==='server-error'||ty==='socket-error'||ty==='socket-closed')return t('p2p.server');
  if(ty==='browser-incompatible')return t('p2p.browser');
  if(ty==='timeout')return t('p2p.timeout');
  return t('p2p.net');}

  sec(t('gTools'));ITEMS.forEach((d,i)=>{if(d.kind==='tool')row(BADGE[i],d.name,d.desc);});
  sec(t('gWeapons'));ITEMS.forEach((d,i)=>{if(d.kind==='weapon')row(BADGE[i],d.name+(d.n>1?' ×'+d.n:''),d.desc);});

/* ================= rooms and game flow ================= */
async function initNet(){if(STANDALONE){if(P2P.supported())setNet('ok','netOk');else setNet('off','netNo');return;}let room=null;
  try{room=window.claude&&typeof window.claude.use==='function'?await window.claude.use('room'):null;}catch(e){room=null;}
  if(!room){setNet('off','netOff');return;}
  ROOM=room;let dropT=0;
  ROOM.onConnection(c=>{clearTimeout(dropT);if(c)setNet('ok','netReady');else dropT=setTimeout(()=>{if(netState!=='off')setNet('wait','netRe');},2000);},()=>{setNet('off','netOff');});
  ROOM.onPeers(ch=>renderLobbyPeers(ch.peers),()=>{});lobbyPresence();}
function waitFor(cond,ms,abort){return new Promise(res=>{const t0=performance.now();const tick=()=>{if(abort&&abort())return res(false);if(cond())return res(true);
  if(performance.now()-t0>ms)return res(false);setTimeout(tick,120);};tick();});}
function errText(e){return e&&e.code==='not_permitted'?t('errPerm'):e&&e.code==='limit_reached'?t('errLimit'):t('errNet');}
const newSeed=()=>(Math.random()*4294967295)>>>0;
const pickMap=()=>prof.map>=0?prof.map:(Math.random()*MAPS.length)|0;
let flowTok=0;
async function hostRoom(){if((!STANDALONE&&!ROOM)||busy)return;busy=true;showLobbyMsg('');const tok=++flowTok;let code;
  if(STANDALONE){let lob=null,err=null;
    for(let k=0;k<4&&!lob;k++){code=String(1000+((Math.random()*9000)|0));showConnecting(t('creating',{c:code}));
      try{lob=await P2P.host(code);}catch(e){err=e;if(!e||e.type!=='unavailable-id')break;}if(tok!==flowTok){busy=false;return;}}
    if(!lob){busy=false;goLobby(t('createFail',{e:p2pErr(err)}));return;}ROOM=lob;}
  else{const used=new Set(lobbyRooms.map(r=>r.code));do{code=String(1000+((Math.random()*9000)|0));}while(used.has(code));showConnecting(t('creating',{c:code}));}
  resetWorld(true,newSeed(),pickMap());G.mode='host';G.code=code;G.roomDur=prof.dur;beginRound(1,performance.now());
  try{await enterRooms(code);}catch(e){busy=false;goLobby(t('createFail',{e:errText(e)}));return;}
  busy=false;if(G.mode!=='host')return;startGame('host');lobbyPresence();}
async function joinRoom(code,name){if((!STANDALONE&&!ROOM)||busy)return;busy=true;showLobbyMsg('');const tok=++flowTok;
  if(STANDALONE){showConnecting(t('entering',{c:code}));try{ROOM=await P2P.join(code,st=>{if(tok===flowTok)$('#connMsg').textContent=t('linking');});}catch(e){busy=false;if(tok===flowTok)goLobby(t('joinFail',{c:code,e:p2pErr(e)}));return;}
    if(tok!==flowTok){busy=false;return;}}
  else showConnecting(t('enteringName',{n:name}));resetWorld(false,1,0);G.mode='guest';G.code=code;G.roomDur=0;beginRound(0,performance.now());
  try{await enterRooms(code);}catch(e){busy=false;goLobby(t('joinFail2',{e:errText(e)}));return;}
  const ok=await waitFor(()=>hostPeer&&G.worldReady&&G.adoptKey!=='none',9000,()=>G.mode!=='guest');busy=false;
  if(G.mode!=='guest')return;if(!ok){goLobby(t('noRoom',{c:code}));return;}
  startGame('guest');lobbyPresence();}
function startSolo(){showLobbyMsg('');resetWorld(true,newSeed(),pickMap());G.roomDur=0;beginRound(0,performance.now());G.mode='solo';G.code=null;startGame('solo');lobbyPresence();}
function showConnecting(msg){$('#connMsg').textContent=msg;lobby.hidden=true;over.hidden=true;connecting.hidden=false;}
let hintShown=false;
function startGame(mode){G.mode=mode;lobby.hidden=true;connecting.hidden=true;over.hidden=true;closeSheets();hud.hidden=false;boostBtn.hidden=false;fireBtn.hidden=false;emoBtn.hidden=false;
  spawnMe(performance.now());requestWake();updateHud();feedLine(t('mapLine',{n:MAPS[G.map].name,tip:MAPS[G.map].tip}),false);}
/* respawn somewhere 70 to 130 metres from a friend so the two of you actually meet */
function spotNearFriend(){const fr=remote.filter(v=>v.kind==='p'&&v.alive);if(!fr.length)return null;const f=fr[(Math.random()*fr.length)|0];
  for(let k=0;k<40;k++){const a=Math.random()*TAU,d=700+Math.random()*600,x=f.x+Math.cos(a)*d,y=f.y+Math.sin(a)*d;
    if(Math.hypot(x,y)>R*0.86||inSolid(x,y,140))continue;let bad=false;
    for(const o of G.obstacles){if((o.meta.zone==='burn'||o.meta.grav)&&Math.hypot(x-o.x,y-o.y)<o.r*(o.meta.grav||1)+120){bad=true;break;}}if(bad)continue;
    let md=Infinity;for(const s of all){const b=s.body;for(let i=0;i<b.length;i+=6){const dx=b[i]-x,dy=b[i+1]-y,dd=dx*dx+dy*dy;if(dd<md)md=dd;}}
    if(md>200*200)return {x,y};}
  return null;}
function spawnMe(now){gather();const p=((G.mode==='host'||G.mode==='guest')&&spotNearFriend())||safeSpot(),life=(G.me?G.me.life:0)+1;
  G.me=new Snake({key:myKey,name:prof.name,skin:prof.skin,kind:'p',owner:myKey,x:p.x,y:p.y,angle:Math.atan2(-p.y,-p.x)+(Math.random()-.5),mass:10,life});
  G.me.invulnT=now+3000;inp.ang=G.me.angle;inp.has=false;G.kills=0;G.bestRank=99;cam.x=p.x;cam.y=p.y;fireState='';
  G.life={t0:now,peak:10,kills:0,pk:0,done:false};}
/* leaving mid-life still banks the xp earned so far */
function bankLife(){if(G.me&&G.me.alive&&G.mode!=='demo'&&G.life&&!G.life.done)finishLife(false,0,performance.now());}
function goLobby(msg){bankLife();leaveRooms();flowTok++;if(STANDALONE){P2P.close();ROOM=null;}clearTimeout(overTimer);G.me=null;resultsEl.hidden=true;G.roomDur=0;beginRound(0,performance.now());resetWorld(true,newSeed(),demoMap());G.mode='demo';G.code=null;busy=false;
  hud.hidden=true;boostBtn.hidden=true;fireBtn.hidden=true;emoBtn.hidden=true;emoBar.hidden=true;over.hidden=true;connecting.hidden=true;lobby.hidden=false;joyHide();inp.boost=false;boostBtn.classList.remove('on');
  showLobbyMsg(msg||'');lobbyPresence();releaseWake();paintAcct();}

  if(!L.kn)who.append(t('overEdge'));else if(L.kn[0]==='#')who.append(t('over'+L.kn));

  renderRewards($('#oRew'),G.lastAward);
  $('#btnAgain').textContent=G.mode==='solo'?t('again'):t('respawn');over.hidden=false;boostBtn.hidden=true;fireBtn.hidden=true;emoBtn.hidden=true;emoBar.hidden=true;}

/* ================= timed rounds ================= */
const resultsEl=$('#results'),resList=$('#resList'),btnNext=$('#btnNext');let lastTickSec=-1,resT=0;
function beginRound(id,now){G.round={id,end:id&&G.roomDur?now+G.roomDur:0,over:false,award:null,awarded:false};G.rs={id,best:0,kills:0,deaths:0,pk:0};G.streak=0;lastTickSec=-1;resultsEl.hidden=true;}
function showPlayUI(){resultsEl.hidden=true;over.hidden=true;boostBtn.hidden=false;fireBtn.hidden=false;emoBtn.hidden=false;}
function syncRound(rd,now){const id=rd[0]|0,left=+rd[1],isOver=!!rd[2];if(!id)return;
  if(id!==G.round.id){const first=G.round.id===0;beginRound(id,now);
    if(!first){clearTimeout(overTimer);over.hidden=true;setTimeout(()=>{if(G.mode==='guest'){spawnMe(performance.now());showPlayUI();toast(t('newRound'));}},450);}}
  if(left>=0){const e=now+left;if(!G.round.end||Math.abs(e-G.round.end)>400)G.round.end=e;}else G.round.end=0;
  if(isOver&&!G.round.over)roundOver(now);}
function roundOver(now){if(G.round.over)return;if(G.me&&G.me.alive){G.rs.best=Math.max(G.rs.best,G.me.mass);if(G.life)G.life.peak=Math.max(G.life.peak,G.me.mass);}G.round.over=true;sfx('end');
  clearTimeout(overTimer);over.hidden=true;boostBtn.hidden=true;fireBtn.hidden=true;emoBtn.hidden=true;emoBar.hidden=true;joyHide();inp.boost=false;boostBtn.classList.remove('on');toast(t('timeUp'));
  setTimeout(showResults,800);}
function showResults(){if(!G.round.over||G.mode==='demo')return;
  const rows=[{name:prof.name,skin:prof.skin,best:Math.floor(G.rs.best),kills:G.rs.kills,deaths:G.rs.deaths,me:true}];
  for(const st of streams.values()){const inf=st.info;if(!inf||!inf.st||inf.st[0]!==G.round.id)continue;rows.push({name:inf.nm,skin:inf.skin,best:inf.st[1],kills:inf.st[2],deaths:inf.st[3],me:false});}
  rows.sort((a,b)=>b.best-a.best||b.kills-a.kills);resList.textContent='';
  rows.forEach((r,i)=>{const li=document.createElement('li');if(r.me)li.className='me';const rk=document.createElement('b');rk.className='rk';rk.textContent=i+1;
    const dot=document.createElement('i');dot.style.background=skinCss(SKINS[r.skin]||SKINS[0]);const nm=document.createElement('span');nm.textContent=r.name+(r.me?t('you'):'');
    const sm=document.createElement('small');sm.append(t('resBest'));const b1=document.createElement('b');b1.textContent=r.best;sm.append(b1,t('resKills'));const b2=document.createElement('b');b2.textContent=r.kills;sm.append(b2);
    li.append(rk,dot,nm,sm);resList.append(li);});
  /* finishing places pay a bonus once per round */
  if(!G.round.awarded){G.round.awarded=true;const rank=rows.findIndex(r=>r.me)+1,bonus=rows.length>=2?(rank===1?50:rank===2?20:0):0;
    if(rank===1&&rows.length>=2){prof.st.wins++;}
    G.round.award=finishLife(false,bonus,performance.now());if(G.round.award&&bonus)G.round.award.place=rank;}
  renderRewards($('#resRew'),G.round.award);
  $('#resWho').textContent=rows.length<2?t('roundOverTitle'):(rows[0].me?t('youWin'):t('xWins',{n:rows[0].name}));
  $('#resNote').textContent=G.mode==='host'?t('resNoteHost'):t('resNoteGuest');
  btnNext.hidden=G.mode!=='host';resultsEl.querySelector('.actions').style.gridTemplateColumns=G.mode==='host'?'':'1fr';resultsEl.hidden=false;}
function hostNextRound(){if(G.mode!=='host')return;const now=performance.now(),id=G.round.id+1;resetWorld(true,newSeed(),G.map);beginRound(id,now);spawnMe(now);showPlayUI();toast(t('newRound'));}

/* ================= HUD ================= */
const hCode=$('#hCode'),hTimer=$('#hTimer'),hLen=$('#hLen'),hKills=$('#hKills'),hRank=$('#hRank'),board=$('#board'),hRoom=$('#hRoom'),netWarn=$('#netWarn'),hHearts=$('#hHearts'),hBuffs=$('#hBuffs');
const mini=$('#mini'),mctx=mini.getContext('2d');
let fireState='',heartState=-1,buffState='';
function updateFire(){const me=G.me,w=me&&me.alive?me.weapon:null,key=w?w.t+':'+w.n+':'+LANG:'none:'+LANG;if(key===fireState)return;fireState=key;fireBtn.textContent='';
  if(w){fireBtn.classList.add('armed');const im=document.createElement('img');im.src=BADGE[w.t];im.alt='';fireBtn.append(im);
    if(w.n>1){const n=document.createElement('span');n.className='n';n.textContent=w.n;fireBtn.append(n);}
    const wn=document.createElement('span');wn.className='wn';wn.textContent=ITEMS[w.t].name;fireBtn.append(wn);fireBtn.setAttribute('aria-label',t('fireAria',{w:ITEMS[w.t].name}));}
  else{fireBtn.classList.remove('armed');fireBtn.textContent=t('fire');fireBtn.setAttribute('aria-label',t('fireEmpty'));}}
const BUFF_SHOW=[['shield','shield'],['turbo','turbo'],['magnet','magnet'],['grow','grow'],['ghost','ghost'],['giant','giant'],['frozen','freeze'],['stun','zap']];
function updateHud(){if(hud.hidden)return;const me=G.me,now=performance.now();
  const ranked=all.filter(s=>s.alive&&s.kind!=='c').sort((a,b)=>b.mass-a.mass);
  hLen.textContent=me?Math.floor(me.mass):0;hKills.textContent=t('hudKills',{n:G.kills});
  const idx=me&&me.alive?ranked.indexOf(me):-1;
  if(idx>=0){G.bestRank=Math.min(G.bestRank,idx+1);hRank.textContent=t('hudRank',{r:idx+1,n:ranked.length});}
  board.textContent='';
  const addRow=(s,rank)=>{const li=document.createElement('li');li.className=s===me?'me':(s.isBot?'':'p');
    const n=document.createElement('b');n.textContent=rank;n.style.fontWeight='600';const i=document.createElement('i');i.style.background=skinCss(SKINS[s.skin]);
    const nm=document.createElement('span');nm.textContent=s===me?prof.name:s.name;const sc=document.createElement('b');sc.textContent=Math.floor(s.mass);li.append(n,i,nm,sc);board.append(li);};
  ranked.slice(0,6).forEach((s,k)=>addRow(s,k+1));
  if(idx>=6){const g=document.createElement('li');g.className='gap';g.textContent='⋯';board.append(g);addRow(me,idx+1);}
  const hc=me&&me.alive?me.hearts:0;if(hc!==heartState){heartState=hc;hHearts.textContent='';for(let k=0;k<hc;k++){const im=document.createElement('img');im.src=HEART;im.alt='';hHearts.append(im);}hHearts.setAttribute('aria-label',t('heartsAria',{n:hc}));}
  hBuffs.textContent='';if(me&&me.alive)for(const [k,icon] of BUFF_SHOW){const left=(me.bf[k]||0)-now;if(left<=0)continue;const it=ITEMS[IT[icon]],dur=it.dur||(k==='frozen'?2000:1500);
    const d=document.createElement('div');d.className='buff';const ring=document.createElement('span');ring.className='ring';ring.style.setProperty('--c',it.color);ring.style.setProperty('--p',clamp(left/dur,0,1).toFixed(3));
    const im=document.createElement('img');im.src=BADGE[IT[icon]];im.alt='';ring.append(im);d.append(ring,Math.ceil(left/1000)+'s');hBuffs.append(d);}
  if(me&&me.alive){const gl=(me.bf.giant||0)-now;if(gl>0&&gl<1600&&G.giantWarned!==me.bf.giant){G.giantWarned=me.bf.giant;toast(t('giantEnding'));sfx('warn');}
    if(!G.round.over)G.rs.best=Math.max(G.rs.best,me.mass);if(G.life)G.life.peak=Math.max(G.life.peak,me.mass);}
  if(G.round.end&&!G.round.over){const sec=Math.ceil(Math.max(0,G.round.end-now)/1000);hTimer.hidden=false;hTimer.textContent=Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');
    hTimer.classList.toggle('hot',sec<=10);if(sec<=10&&sec>0&&sec!==lastTickSec){lastTickSec=sec;sfx('tick');}}
  else hTimer.hidden=true;
  if(STANDALONE&&G.mode==='host'&&RS&&RS.peers().length<=1){hCode.hidden=false;const ck=G.code+LANG;if(hCode.dataset.c!==ck){hCode.dataset.c=ck;hCode.textContent='';const tl=document.createElement('span');tl.textContent=t('codeLbl');
      const b=document.createElement('b');b.textContent=G.code;const sm=document.createElement('small');sm.textContent=t('codeHint');hCode.append(tl,b,sm);}}else hCode.hidden=true;
  if(!resultsEl.hidden&&now-resT>600){resT=now;showResults();}
  updateFire();
  if(G.mode==='solo')hRoom.textContent=t('chipSolo');
  else if(G.code)hRoom.textContent=t('chipRoom',{c:G.code,n:RS?RS.peers().filter(p=>p.kind==='viewer').length:1});
  let warn='';if(RS&&!RS.connected())warn=t('netUnstable');
  else if(G.mode==='guest'&&hostPeer){const st=streams.get(hostPeer);if(st&&now-st.lastRecv>2000)warn=t('hostSilent');}
  netWarn.textContent=warn;netWarn.hidden=!warn;
  emoBtn.classList.toggle('cool',now<emoReadyAt);}
function drawMini(){if(hud.hidden)return;const s=mini.width,g=mctx,c=s/2,k=(c-7)/R;g.clearRect(0,0,s,s);
  g.fillStyle='rgba(9,15,29,.72)';g.beginPath();g.arc(c,c,c-3,0,TAU);g.fill();g.lineWidth=4;g.strokeStyle=THEMES[MAPS[G.map].id].border;g.globalAlpha=0.8;g.stroke();g.globalAlpha=1;
  for(const o of G.obstacles){const col={spike:'rgba(200,245,255,.55)',tree:'rgba(40,110,40,.8)',planet:'rgba(150,130,255,.7)',bumper:'rgba(255,170,220,.6)',lava:'rgba(255,110,30,.7)',bush:'rgba(80,170,70,.45)'}[o.type];
    g.fillStyle=col;g.beginPath();g.arc(c+o.x*k,c+o.y*k,Math.max(2.5,o.r*k),0,TAU);g.fill();}

    for(let k=0;k<14;k++){const a=k/14*TAU,rr=18+(k%3)*6;g.fillStyle=PAL.party[k%6];g.beginPath();g.arc(W/2+Math.cos(a)*rr*1.6,H/2+Math.sin(a)*rr*0.8,3.5,0,TAU);g.fill();}return;}
  const S={list:[],later:[]},P={game:false,list:S.list,later:S.later};KFX_PLAY[id](P,0,0,14,0);
  for(const f of S.later.splice(0))f.fn(f.at);drawPv(cv,S,id==='fireworks'?760:id==='blackhole'?520:id==='gg'?600:id==='thunder'?60:420,id==='fireworks'?2.1:1);}
function drawPv(cv,S,now,zoomOut){const g=cv.getContext('2d'),W=cv.width,H=cv.height;g.clearRect(0,0,W,H);const k=H/170/(zoomOut||1);
  const P2=(x,h,y)=>({sx:W/2+x*k,sy:H*(zoomOut>1?0.98:0.8)-h*k+y*k*0.55,ok:true});drawOfxList(g,S.list,S.later,now,P2,k,W,H);}
function drawKfxPreview(cv,id,now){let S=cv._kfx;if(!S||S.id!==id){S=cv._kfx={id,list:[],later:[],next:0};}
  const g=cv.getContext('2d'),W=cv.width,H=cv.height;
  if(now>=S.next){S.next=now+2300;S.born=now;S.list.length=0;S.later.length=0;if(KFX_PLAY[id])KFX_PLAY[id]({game:false,list:S.list,later:S.later},0,0,14,now+260);
    else for(let k=0;k<22;k++){const a=Math.random()*TAU,v=120+Math.random()*120;S.list.push({ty:'dot',x:0,y:0,h:14,vx:Math.cos(a)*v,vy:Math.sin(a)*v,vh:80+Math.random()*120,g:300,t0:now+260,life:700,size:6,col:PAL.party[k%6],seed:Math.random()});}}
  const far=id==='fireworks';g.clearRect(0,0,W,H);const k=H/(far?400:215),P2=(x,h,y)=>({sx:W/2+x*k,sy:H*(far?0.9:0.78)-h*k+y*k*0.55,ok:true});
  const age=now-S.born;if(age<260){const p=P2(0,14,0),rr=26*k*(1-age/260*0.4);const gr=g.createRadialGradient(p.sx-rr*0.3,p.sy-rr*0.3,rr*0.1,p.sx,p.sy,rr);
    gr.addColorStop(0,'#ffd0d8');gr.addColorStop(1,'#d2335a');g.fillStyle=gr;g.beginPath();g.arc(p.sx,p.sy,rr,0,TAU);g.fill();}
  drawOfxList(g,S.list,S.later,now,P2,k,W,H);}
function drawEmotePreview(cv,e,now){const g=cv.getContext('2d'),W=cv.width,H=cv.height;g.clearRect(0,0,W,H);const age=(now%2600);
  g.save();g.scale(2,2);emoteBubble(g,W/4,H/2*0.82,e,age,true);g.restore();}
/* ---------- reward panel on the death screen and round results ---------- */
function renderRewards(el,aw){el.textContent='';if(!aw){el.hidden=true;return;}el.hidden=false;
  const top=document.createElement('div');top.className='rew-l';const b1=document.createElement('b');b1.textContent='+'+aw.xp;
  const b2=document.createElement('b');b2.textContent='+'+aw.coins;const ci=document.createElement('i');ci.className='coin';
  const sep=document.createElement('span');sep.className='sep';sep.textContent='·';top.append(b1,' XP ',sep,ci,b2);
  if(aw.place){const pl=document.createElement('small');pl.textContent=t('place',{r:aw.place});top.append(pl);}
  const bar=document.createElement('div');bar.className='rew-bar';const lv=document.createElement('span');lv.className='lvb';lv.textContent=t('lv',{n:aw.lvTo});
  const xb=document.createElement('span');xb.className='xpbar';const fill=document.createElement('i');xb.append(fill);const sm=document.createElement('small');sm.textContent=t('xpOf',{a:aw.to.into,b:aw.to.need});
  bar.append(lv,xb,sm);el.append(top,bar);
  const from=aw.lvTo>aw.lvFrom?0:aw.from.into/aw.from.need*100,to=aw.to.into/aw.to.need*100;fill.style.width=from+'%';requestAnimationFrame(()=>requestAnimationFrame(()=>{fill.style.width=to.toFixed(1)+'%';}));
  if(aw.lvTo>aw.lvFrom){const up=document.createElement('div');up.className='rew-up';const tx=document.createElement('span');
    tx.textContent=t('lvUp',{n:aw.lvTo})+(aw.unlocked.length?' · '+t('unlockedList',{list:aw.unlocked.join(t('listSep'))}):'');
    const go=document.createElement('button');go.type='button';go.className='linkbtn';go.textContent=t('goLocker');go.addEventListener('click',()=>{const last=prof.newIds[prof.newIds.length-1];
      if(last){const [c,id]=last.split(':');openLocker(c==='p'?'e':c,c,id);}else openLocker('s');});
    up.append(tx,go);el.append(up);if(!aw.shown){aw.shown=true;sfx('levelup',1,true);}}
  else if(!aw.shown){aw.shown=true;sfx('coin',0.8,true);}}
paintAcct();
langHooks.push(()=>{paintAcct();if(!lockerEl.hidden){paintLockerAcct();renderGrid();renderDetail();}});

/* ================= start ================= */
applyI18n();
if(R3.init($('#game'))){resetWorld(true,newSeed(),demoMap());gather();const fb=G.bots[G.bots.length-1];cam.x=fb.x;cam.y=fb.y;requestAnimationFrame(loop);initNet();}
else{lobby.hidden=true;$('#nogl').hidden=false;}

})();
