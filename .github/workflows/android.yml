# Builds the Android app (the app folder) on GitHub's servers. It starts by itself when the app folder or this file
# changes on main, and you can also start it from the Actions tab (Android > Run workflow).
# The app plays its own copy of the game, app/www/index.html, so the website at the top of the repo can be updated
# on a different day (for example when the network version changes and the app is still in store review).
# Without the upload key secrets you still get app-debug.apk, which installs directly on an Android phone for testing.
# With them you also get app-release.aab, the file Google Play wants.
name: Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/android.yml'

# a newer push makes the build still running for an older one stop
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: app

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        run: npm ci

      # app.config.json (server, ad units, purchase keys) and the bundled plugins, then the native projects
      - name: Apply app.config.json
        run: node scripts/configure.mjs
      - name: Bundle the native plugins for the game page
        run: node scripts/build-native.mjs

      - name: Copy the game into the Android project
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload-keystore.jks" >> "$GITHUB_ENV"
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret: building the debug APK only"
          fi

      - name: Build
        working-directory: app/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: upload
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          if [ -n "$ANDROID_KEYSTORE_PATH" ]; then
            ./gradlew --no-daemon assembleDebug bundleRelease
          else
            ./gradlew --no-daemon assembleDebug
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: snake-android-${{ github.run_number }}
          path: |
            app/android/app/build/outputs/apk/debug/app-debug.apk
            app/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
